[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maverickpicks-models"
version = "0.1.0"
description = "MaverickPicks NBA/NHL betting models: data pipeline, odds, injuries, tracking"
requires-python = ">=3.11"
dependencies = ["pyodbc", "requests", "openpyxl", "pdfplumber", "tzdata", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
